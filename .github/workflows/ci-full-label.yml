name: CI full set (run-full-ci label)

# Pull requests run the macOS/Windows jobs only for platform-specific diffs (scripts/ci-platform-scope.mjs,
# senpi#3957). Adding the run-full-ci label runs the full set now, without a new push: the called workflows see the
# label on the event and classify the run as full. Later pushes to a labelled PR run the full set in their own CI run.
on:
  pull_request:
    types: [labeled]

permissions:
  contents: read
  pull-requests: read

jobs:
  ci:
    if: github.event.label.name == 'run-full-ci'
    uses: ./.github/workflows/ci.yml

  read-summary-binary-parity:
    if: github.event.label.name == 'run-full-ci'
    uses: ./.github/workflows/read-summary-binary-parity.yml

  session-worker-compile:
    if: github.event.label.name == 'run-full-ci'
    uses: ./.github/workflows/session-worker-compile.yml
